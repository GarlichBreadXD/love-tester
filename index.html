<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Love Tester</title>
    <style>
      :root {
        --bg1: #1b1024;
        --bg2: #321a3d;
        --card: rgba(255, 255, 255, 0.08);
        --card-border: rgba(255, 255, 255, 0.12);
        --text: #fff6fb;
        --muted: #f3d7e4;
        --pink: #ff5ca8;
        --pink-bright: #ff8ec7;
        --violet: #b97cff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, var(--bg2), var(--bg1) 50%);
        color: var(--text);
      }

      .container {
        width: min(90vw, 560px);
      }

      .card {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 22px;
        padding: 2rem;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(8px);
      }

      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-size: 0.68rem;
        color: var(--pink-bright);
        margin: 0 0 0.5rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 4vw, 3.1rem);
      }

      .subtitle {
        margin: 0.75rem 0 1.5rem;
        color: var(--muted);
        line-height: 1.5;
      }

      .inputs {
        display: grid;
        gap: 1rem;
        margin-bottom: 1.2rem;
      }

      label {
        display: grid;
        gap: 0.45rem;
        color: var(--muted);
        font-size: 0.92rem;
      }

      input {
        width: 100%;
        padding: 0.9rem 1rem;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.07);
        color: var(--text);
        font-size: 1rem;
      }

      input:focus {
        outline: 2px solid var(--pink-bright);
        outline-offset: 2px;
      }

      button {
        width: 100%;
        margin-top: 0.5rem;
        padding: 0.95rem 1.25rem;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--pink), var(--violet));
        color: white;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        box-shadow: 0 12px 24px rgba(255, 92, 168, 0.32);
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(1px);
      }

      .result {
        margin-top: 1.6rem;
        text-align: center;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding-top: 1.2rem;
      }

      .score {
        font-size: clamp(2.8rem, 7vw, 4.5rem);
        font-weight: 900;
        background: linear-gradient(135deg, #ffd3ee, #ff9bd0, #ffd6f5);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        line-height: 1;
      }

      #message {
        margin: 0.8rem 0 0;
        color: var(--muted);
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="card">
        <p class="eyebrow">Relationship report</p>
        <h1>Love Tester</h1>
        <p class="subtitle">The romance algorithm is calibrated for maximum chemistry.</p>

        <div class="inputs">
          <label>
            Name 1
            <input id="nameA" type="text" value="You" maxlength="20" />
          </label>

          <label>
            Name 2
            <input id="nameB" type="text" value="Your Crush" maxlength="20" />
          </label>
        </div>

        <button id="testBtn" type="button">Test the love</button>

        <div id="result" class="result" aria-live="polite">
          <div class="score">100%</div>
          <p id="message">Absolutely perfect match. True love confirmed.</p>
        </div>
      </div>
    </main>

    <script>
      const nameAInput = document.getElementById('nameA');
      const nameBInput = document.getElementById('nameB');
      const testBtn = document.getElementById('testBtn');
      const messageEl = document.getElementById('message');

      function updateLoveResult() {
        const nameA = nameAInput.value.trim() || 'You';
        const nameB = nameBInput.value.trim() || 'Your Crush';

        messageEl.textContent = `${nameA} + ${nameB} = 100% soulmate energy. Pure romance detected.`;
      }

      testBtn.addEventListener('click', updateLoveResult);
      nameAInput.addEventListener('input', updateLoveResult);
      nameBInput.addEventListener('input', updateLoveResult);

      updateLoveResult();
    </script>
  </body>
</html>
